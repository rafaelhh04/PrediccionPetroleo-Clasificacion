name: Release

# Publishes a GitHub Release, in one of two ways:
#
# - push a version tag:   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
# - run the workflow by hand (Actions → Release → Run workflow) with the version and, optionally, the
#   commit to release (default: the head of the chosen branch). The release creates the tag on GitHub,
#   for environments that cannot push tags.
#
# The version must match pyproject.toml at the released commit. The notes are the version's section of
# the changelog, generated with git-cliff from the Conventional Commits (cliff.toml), preceded by the
# highlights in .github/release-notes/<tag>.md when that file exists. The wheel and the sdist are
# attached.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 1.0.0)
        required: true
        type: string
      ref:
        description: Full SHA of the commit to release (default, the head of the selected branch)
        required: false
        type: string

permissions:
  contents: read

env:
  GIT_CLIFF: git-cliff@2.14.2 # same pinned version as `make changelog`

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release (and, when dispatched, its tag) and upload the assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # git-cliff needs the whole history and the tags
      - uses: astral-sh/setup-uv@v7
      - name: Resolve the tag and check it against the package version
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#v}"
          fi
          version="$(uv version --short)"
          if [ "v${version}" != "$tag" ]; then
            echo "::error::Tag ${tag} does not match pyproject.toml version ${version}"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Release notes (git-cliff)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            uvx "$GIT_CLIFF" --latest --strip all --output CHANGES.md
          else
            uvx "$GIT_CLIFF" --unreleased --tag "$TAG" --strip all --output CHANGES.md
          fi
          highlights=".github/release-notes/${TAG}.md"
          if [ -f "$highlights" ]; then
            { cat "$highlights"; echo; cat CHANGES.md; } > NOTES.md
          else
            cp CHANGES.md NOTES.md
          fi
      - name: Build the wheel and the sdist
        run: uv build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            target=(--verify-tag)
          else
            target=(--target "$SHA")
          fi
          gh release create "$TAG" dist/* --title "$TAG" --notes-file NOTES.md "${target[@]}"

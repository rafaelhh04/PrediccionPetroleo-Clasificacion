name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC: catches breakage from new upstream releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # never touch uv.lock in CI
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: codespell
        run: uv run codespell

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Overrides .python-version for every uv command of this job.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false # coverage is enforced by pytest (fail_under = 85), not by Codecov

  slow:
    name: Slow end-to-end tests
    # Only on demand and on the weekly schedule: they run the full CLI training.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run slow tests
        run: uv run pytest -m slow

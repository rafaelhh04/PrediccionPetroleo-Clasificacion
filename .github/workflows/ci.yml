name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC: catches breakage from new upstream releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # never touch uv.lock in CI
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: codespell
        run: uv run codespell

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Overrides .python-version for every uv command of this job.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false # coverage is enforced by pytest (fail_under = 85), not by Codecov

  docker:
    name: Docker image (build, smoke test, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: brent-forecast:ci
      DASHBOARD_IMAGE: brent-forecast-dashboard:ci
      # Pinned scanner image (Dependabot does not track it: bump it by hand).
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - uses: actions/checkout@v7
      - name: Build the images (API, dashboard)
        run: |
          docker build --tag "$IMAGE" .
          docker build --target dashboard --tag "$DASHBOARD_IMAGE" .
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Smoke test (non-root user, liveness, readiness without a registry)
        run: |
          docker run --detach --name api --publish 8000:8000 "$IMAGE"
          for _ in $(seq 60); do curl --silent --fail localhost:8000/health/live && break; sleep 2; done
          echo
          test "$(docker exec api id -u)" = "10001"
          # No registry in the image: the API is up but not ready (503) and says why.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' localhost:8000/health)" = "503"
          curl --silent localhost:8000/health
          # Observability: Prometheus metrics and the request id echoed back.
          curl --silent --fail localhost:8000/metrics | grep '^brent_model_loaded{alias="champion"} 0.0'
          curl --silent --include --header 'X-Request-ID: ci-smoke' localhost:8000/health/live \
            | grep --ignore-case '^x-request-id: ci-smoke'
          docker inspect --format '{{json .Config.Healthcheck}}' api
      - name: Smoke test the dashboard (non-root, Streamlit health)
        run: |
          docker run --detach --name dashboard --publish 8501:8501 "$DASHBOARD_IMAGE"
          for _ in $(seq 60); do curl --silent --fail localhost:8501/_stcore/health && break; sleep 2; done
          echo
          test "$(docker exec dashboard id -u)" = "10001"
          curl --silent --fail localhost:8501/_stcore/health
      - name: Container logs
        if: always()
        run: |
          docker logs api || true
          docker logs dashboard || true
      - name: Trivy report (HIGH and CRITICAL, informational)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
          "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --no-progress "$IMAGE"
      - name: Trivy gate (fail on fixable CRITICAL vulnerabilities, both images)
        run: |
          for image in "$IMAGE" "$DASHBOARD_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
              --skip-db-update --no-progress "$image"
          done

  infra:
    name: Terraform (fmt, validate, test, tflint, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned tool images, run like Trivy above (no third-party actions).
      TERRAFORM_IMAGE: hashicorp/terraform:1.16.6
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.59.1
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - name: terraform fmt
        run: docker run --rm -v "$PWD:/infra" -w /infra "$TERRAFORM_IMAGE" fmt -recursive -check -diff
      - name: terraform validate (no backend, no credentials)
        run: |
          for dir in bootstrap .; do
            docker run --rm -v "$PWD:/infra" -w "/infra/$dir" "$TERRAFORM_IMAGE" \
              init -backend=false -input=false -lockfile=readonly
            docker run --rm -v "$PWD:/infra" -w "/infra/$dir" "$TERRAFORM_IMAGE" validate
          done
      - name: terraform test (mocked providers)
        run: docker run --rm -v "$PWD:/infra" -w /infra "$TERRAFORM_IMAGE" test
      - name: tflint (terraform + google rulesets)
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download from GitHub releases (rate limit)
        run: |
          tflint() {
            docker run --rm -v "$PWD:/data" -w /data -e GITHUB_TOKEN \
              -e TFLINT_PLUGIN_DIR=/data/.tflint.d/plugins "$TFLINT_IMAGE" "$@"
          }
          tflint --init --config /data/.tflint.hcl
          tflint --recursive --config /data/.tflint.hcl --format compact
      - name: Trivy IaC scan (fail on MEDIUM and above, both MLflow backends)
        run: |
          for vars in "" "--tf-vars /infra/tests/cloudsql.tfvars"; do
            # shellcheck disable=SC2086 # $vars is intentionally split into flag and value
            docker run --rm -v "$PWD:/infra:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
              config --severity MEDIUM,HIGH,CRITICAL --exit-code 1 $vars /infra
          done

  slow:
    name: Slow end-to-end tests
    # Only on demand and on the weekly schedule: they run the full CLI training.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run slow tests
        run: uv run pytest -m slow

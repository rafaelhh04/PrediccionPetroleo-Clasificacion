# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # The image must run the Python versions CI tests (3.12/3.13): only patch/OS updates
      # of python:3.12-slim-*; moving to a new minor is a deliberate change.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Terraform providers (infra/ and infra/bootstrap/): updates .terraform.lock.hcl too.
  - package-ecosystem: "terraform"
    directories: ["/infra", "/infra/bootstrap"]
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(infra)"
    groups:
      providers:
        patterns: ["*"]

# Local stack: inference API + Streamlit dashboard + MLflow tracking server (UI), sharing the registry.
#
#   docker compose build
#   docker compose --profile train run --rm trainer   # once: train, report, register the champion
#   docker compose up -d                              # API :8000, dashboard :8501, MLflow UI :5000
#
# mlruns/ (SQLite store + artefacts) and results/ live in named volumes mounted at the same
# path in every container, so the artefact locations recorded by the trainer resolve in the API
# and in the MLflow server. data/ is the host folder, read-only (`brent data download` first).

name: brent-forecast

x-app: &app
  image: brent-forecast:latest
  build:
    context: .
  volumes:
    - mlruns:/app/mlruns
    - results:/app/results
    - ./data:/app/data:ro
  environment:
    BRENT_SERVING__ALIAS: ${BRENT_SERVING__ALIAS:-champion}

services:
  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    # Readiness probe inherited from the image (HEALTHCHECK on /health).

  dashboard:
    image: brent-forecast-dashboard:latest
    build:
      context: .
      target: dashboard
    volumes:
      - results:/app/results:ro
      - ./data:/app/data:ro
    environment:
      BRENT_DASHBOARD__API_URL: http://api:8000
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      - api
    restart: unless-stopped

  mlflow:
    <<: *app
    entrypoint: ["mlflow"]
    command:
      - server
      - --backend-store-uri=sqlite:////app/mlruns/mlflow.db
      - --default-artifact-root=/app/mlruns/artifacts
      - --host=0.0.0.0
      - --port=5000
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # One-off job (not started by `up`): training, statistical report + promotion, explanations.
  trainer:
    <<: *app
    profiles: ["train"]
    entrypoint: ["sh", "-c"]
    command: ["brent train && brent report && brent explain"]
    healthcheck:
      disable: true

volumes:
  mlruns:
  results:

[project]
name = "brent-forecast"
version = "0.1.0"
description = "Next-day Brent crude oil price direction classifier with market and geopolitical features."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafael Hernando Herias" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.4",
    "kagglehub>=1.0",
    "lightgbm>=4.5",
    "matplotlib>=3.10",
    "mlflow>=3.1",
    "numpy>=2.2",
    "optuna>=4.1",
    "pandas>=2.2",
    "pandera>=0.22",
    "pyarrow>=18",
    "pydantic-settings>=2.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "shap>=0.46",
    "statsmodels>=0.14.4",
    "typer>=0.15",
]

[project.scripts]
brent = "brent_forecast.cli:app"

[dependency-groups]
dev = [
    "codespell>=2.4",
    "dvc>=3.50",
    "hypothesis>=6.120",
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow end-to-end tests are opt-in: `pytest -m slow` or `make test-all`.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
markers = ["slow: end-to-end tests that run the CLI training pipeline (excluded by default)"]
xfail_strict = true
# shap's colour maps use matplotlib APIs scheduled for deprecation (upstream issue).
filterwarnings = [
    "ignore::PendingDeprecationWarning:shap.*",
    # MLflow's SQLAlchemy store uses a deprecated loader strategy (upstream).
    "ignore:The ``noload`` loader strategy:DeprecationWarning",
]

[tool.coverage.run]
source = ["brent_forecast"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "D",   # pydocstyle
]
ignore = [
    "N803", # argument name should be lowercase: X_train/X_val follow the scikit-learn convention
    "N806", # variable in function should be lowercase: same convention (X, Z1, A1, dW1...)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test names document intent; docstrings there add noise.
"tests/**" = ["D"]
# matplotlib.use("Agg") must run before importing pyplot.
"src/brent_forecast/**/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These libraries ship no type information (no py.typed / stubs).
module = ["sklearn.*", "scipy.*", "shap.*", "statsmodels.*", "kagglehub.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Custom scikit-learn estimators must subclass BaseEstimator & mixins, which are
# untyped (Any) because scikit-learn ships no type information. Only the modules
# that define estimators relax this single check.
module = [
    "brent_forecast.features.transformers",
    "brent_forecast.models.mlp",
    "brent_forecast.models.baselines",
]
disallow_subclassing_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.codespell]
# "te": table header "Gap te-val" (test minus validation); "fpr": false positive rate.
ignore-words-list = "te,fpr"
# Spanish documents and generated/local folders are not spell-checked. Both basename and
# relative-path forms are listed: a bare `codespell` run (CI) matches basenames while the
# explicit file list passed by pre-commit is matched as full paths.
skip = "uv.lock,*.csv,ROADMAP.md,docs/ROADMAP.md,README.es.md,htmlcov,.venv,results"

      hash: md5
      md5: f4763dc1e9e15b9e0f4146b88a66c029.dir
      size: 20346
      nfiles: 4
    params:
      configs/default.yaml:
        evaluation.learning_curve_train_sizes:
        - 0.1
        - 0.25
        - 0.5
        - 0.75
        - 1.0
        models:
          logistic_regression:
            params:
              C: 1.0
              solver: lbfgs
              max_iter: 1000
            grid:
              C:
              - 0.01
              - 0.1
              - 1.0
              - 10.0
          svm:
            params:
              kernel: rbf
              C: 1.0
              gamma: scale
            grid:
              C:
              - 0.1
              - 1.0
              - 10.0
              gamma:
              - scale
              - 0.01
              - 0.1
          random_forest:
            params:
              n_estimators: 200
              max_depth: 10
              min_samples_leaf: 20
              n_jobs: -1
            grid:
              n_estimators:
              - 100
              - 200
              max_depth:
              - 5
              - 10
              - 20
              min_samples_leaf:
              - 10
              - 20
              - 50
          mlp:
            params:
              hidden_1: 64
              hidden_2: 32
              dropout_p: 0.2
              learning_rate: 0.01
              batch_size: 64
              max_epochs: 100
              patience: 10
              validation_fraction: 0.1
              early_stopping_metric: loss
            grid:
              hidden_pair:
              - - 32
                - 16
              - - 64
                - 32
              - - 128
                - 64
              learning_rate:
              - 0.005
              - 0.01
              - 0.05
          lightgbm:
            params:
              n_estimators: 200
              learning_rate: 0.05
              num_leaves: 15
              subsample_freq: 1
              n_jobs: 1
              deterministic: true
              force_row_wise: true
              verbose: -1
            space:
              n_estimators:
                type: int
                low: 50
                high: 500
                log: true
              learning_rate:
                type: float
                low: 0.005
                high: 0.1
                log: true
              num_leaves:
                type: int
                low: 4
                high: 64
                log: true
              max_depth:
                type: int
                low: 2
                high: 8
              min_child_samples:
                type: int
                low: 20
                high: 200
                log: true
              subsample:
                type: float
                low: 0.5
                high: 1.0
              colsample_bytree:
                type: float
                low: 0.5
                high: 1.0
              reg_lambda:
                type: float
                low: 0.001
                high: 10.0
                log: true
        preprocessing:
          vif_threshold: 10.0
          winsor_lower: 0.01
          winsor_upper: 0.99
        seed: 42
        split:
          test_start: '2024-01-01'
        tracking:
          enabled: true
          uri: sqlite:///mlruns/mlflow.db
          artifact_dir: mlruns/artifacts
          experiment: brent-direction
          registered_model: brent-direction-classifier
        tuning:
          n_trials: 50
          timeout:
          pruning: true
          startup_trials: 10
        validation:
          purge: 1
          embargo: 5
          tuning_splits: 5
          scoring: roc_auc
          mode: expanding
          test_window: 63
          rolling_train_size: 1260
    outs:
    - path: results/metrics.json

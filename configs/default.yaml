# Default configuration for the Brent direction classifier.
#
# Any value can be overridden with an environment variable prefixed with
# BRENT_ and using "__" as the nesting delimiter, e.g.:
#   BRENT_SEED=7
#   BRENT_PATHS__DATA_DIR=/mnt/data
#   BRENT_SPLIT__TEST_START=2023-01-01
#   BRENT_MODELS__RANDOM_FOREST__GRID='{"max_depth": [5, 10]}'
# Relative paths are resolved against the current working directory.
#
# Overrides are DEEP-MERGED into this file: the example above replaces only
# `max_depth` and keeps the other keys of the random-forest grid. To shrink a
# grid, override every one of its keys.

seed: 42

paths:
  data_dir: data/raw
  results_dir: results
  checksums_file: configs/data_checksums.json

data:
  kaggle_dataset: kavyadhyani/global-oil-prices-andgeopolitical-events
  oil_filename: oil_geopolitics_dataset_2010_2026.csv
  events_filename: geopolitical_events_timeline.csv
  # Sanity bounds checked after loading (catch a truncated or wrong file).
  expected_start_min: "2009-01-01"
  expected_start_max: "2011-12-31"
  expected_end_min: "2025-01-01"

# Development period: everything before `test_start` (hyperparameter tuning).
# Out-of-sample period: from `test_start` on, evaluated by walk-forward.
split:
  test_start: "2024-01-01"

preprocessing:
  vif_threshold: 10.0     # iteratively drop the feature with the highest VIF above this
  winsor_lower: 0.01      # percentile bounds for return features (fitted on train only)
  winsor_upper: 0.99

# Purged walk-forward validation (see brent_forecast.validation.walk_forward).
validation:
  purge: 1                 # label horizon: day t's label is realised on t+1
  embargo: 5               # extra buffer rows (features use rolling windows of up to 30 days)
  tuning_splits: 5         # walk-forward folds inside the development period
  scoring: roc_auc
  mode: expanding          # expanding | rolling training window
  test_window: 63          # out-of-sample rows per refit (~1 quarter of trading days)
  rolling_train_size: 1260 # rows in the rolling training window (~5 years), rolling mode only

evaluation:
  learning_curve_train_sizes: [0.1, 0.25, 0.5, 0.75, 1.0]
  # `brent report`: circular block bootstrap of the out-of-sample predictions.
  bootstrap_resamples: 2000
  block_length: 21          # ~1 trading month: keeps short-range serial dependence
  confidence_level: 0.95
  alpha: 0.05               # significance level, after Holm correction
  reliability_bins: 10      # quantile bins of the reliability diagram

# Economic backtest in `brent report`: long when P(up) >= threshold, flat (or short) otherwise.
backtest:
  cost_bps: 5.0             # cost per unit of turnover, in basis points (commission + slippage)
  threshold: 0.5
  allow_short: false
  periods_per_year: 252     # trading days, to annualise returns and Sharpe ratios

# MLflow (`brent train` logs every candidate; `brent report` logs the statistics and promotes).
# Local by default: a SQLite store and an artefact folder under mlruns/ (ignored by git).
# Point `uri` to a tracking server (e.g. http://localhost:5000) to share runs.
tracking:
  enabled: true
  uri: sqlite:///mlruns/mlflow.db
  artifact_dir: mlruns/artifacts
  experiment: brent-direction
  registered_model: brent-direction-classifier

# `brent data ingest`: append the days after the last available date to a copy of the prices file
# (data/live/), never to the versioned raw snapshot. Brent defines the trading days; the other
# series are aligned to them. GPR and geopolitical events have no live source (see the README).
live:
  lookback_days: 60         # history used to recompute rolling columns (30-day volatility)
  timeout_seconds: 20
  sources:
    brent_price: {provider: yahoo, symbol: BZ=F}        # ICE Brent front-month future
    wti_price: {provider: yahoo, symbol: CL=F}          # NYMEX WTI front-month future
    dxy_index: {provider: yahoo, symbol: DX-Y.NYB}      # ICE US Dollar Index
    vix: {provider: fred, symbol: VIXCLS}               # CBOE VIX close (FRED)

# `brent explain`: every listed model is refitted on the development period and explained on the
# out-of-sample period (permutation importance on raw features, SHAP on the model inputs).
explain:
  models: [logistic_regression, random_forest, lightgbm]
  permutation_repeats: 10   # shuffles per feature (ROC AUC drop)
  background_rows: 100      # development rows used as the SHAP background distribution
  max_explained_rows: 600   # out-of-sample rows explained with SHAP (the whole period by default)

# Bayesian optimisation (Optuna, TPE sampler seeded with `seed`) for models with a `space`.
# Each trial is scored with the same purged walk-forward CV as the grid searches; with pruning,
# a trial whose running mean AUC is below the median of earlier trials at the same fold stops.
tuning:
  n_trials: 50
  timeout: null             # seconds; null = run every trial (a timeout breaks reproducibility)
  pruning: true
  startup_trials: 10        # random trials before TPE and pruning kick in

# `params` are the fixed hyperparameters; `grid` (exhaustive) or `space` (Optuna) is the
# search space. random_state is injected from `seed` for every model.
models:
  logistic_regression:
    params:
      C: 1.0
      solver: lbfgs
      max_iter: 1000
    grid:
      C: [0.01, 0.1, 1.0, 10.0]

  svm:
    params:
      kernel: rbf
      C: 1.0
      gamma: scale
      # Probabilities come from sigmoid calibration (CalibratedClassifierCV) of the final model.
    grid:
      C: [0.1, 1.0, 10.0]
      gamma: [scale, 0.01, 0.1]

  random_forest:
    params:
      n_estimators: 200
      max_depth: 10
      min_samples_leaf: 20
      n_jobs: 1             # parallel trees sum probabilities in a non-deterministic order
    grid:
      n_estimators: [100, 200]
      max_depth: [5, 10, 20]
      min_samples_leaf: [10, 20, 50]

  mlp:
    params:
      hidden_1: 64
      hidden_2: 32
      dropout_p: 0.2
      learning_rate: 0.01
      batch_size: 64
      max_epochs: 100
      patience: 10
      validation_fraction: 0.1      # last 10 % of the training rows, for early stopping
      early_stopping_metric: loss   # validation BCE; "auc" was the original criterion
    grid:
      hidden_pair: [[32, 16], [64, 32], [128, 64]]
      learning_rate: [0.005, 0.01, 0.05]

  lightgbm:
    params:
      n_estimators: 200
      learning_rate: 0.05
      num_leaves: 15
      subsample_freq: 1     # enable row subsampling (bagging) every iteration
      n_jobs: 1             # single thread + deterministic: bit-for-bit reproducible
      deterministic: true
      force_row_wise: true
      verbose: -1
    space:
      n_estimators: {type: int, low: 50, high: 500, log: true}
      learning_rate: {type: float, low: 0.005, high: 0.1, log: true}
      num_leaves: {type: int, low: 4, high: 64, log: true}
      max_depth: {type: int, low: 2, high: 8}
      min_child_samples: {type: int, low: 20, high: 200, log: true}
      subsample: {type: float, low: 0.5, high: 1.0}
      colsample_bytree: {type: float, low: 0.5, high: 1.0}
      reg_lambda: {type: float, low: 0.001, high: 10.0, log: true}
